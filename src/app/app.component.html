<div class="top-menu">

  <img class="logo"
       src="https://angular-academy.s3.amazonaws.com/main-logo/main-page-logo-small-hat.png">

</div>

<div>

  <div class="courses">

    <!-- async pipe gets the values from observable object-->
    <course-card *ngFor="let todo of ((todos$ | async) | filterByCompleted: 'true')"
                 [todo]="todo">

      <div>
        <h1>{{todo.title}}</h1>
      </div>

    </course-card>

  </div>


</div>
